name: SMA 5/10/20 alerts

on:
  schedule:
    # Every 15 min, Mon–Fri, 13:00–21:00 UTC.
    # That window covers US market hours (9:30–16:00 ET) in both
    # winter (EST = UTC-5) and summer (EDT = UTC-4).
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a check manually from the Actions tab

permissions:
  contents: write          # needed to commit state.json back to the repo

concurrency:
  group: sma-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SMA check
        env:
          # Edit the ticker list here (comma-separated):
          TICKERS: "SOXL, MU, SNDK, COHR, LITE"
          # Set this as a repository variable or secret (Settings → Secrets and variables → Actions):
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional second channel:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set to "1" if you also want a ping when price drops back below an SMA:
          ALERT_ON_DROP: "0"
        run: python check_sma.py

      - name: Commit updated state
        run: |
          git config user.name "sma-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "Update SMA state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
